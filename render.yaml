databases:
  - name: taxflow-db
    plan: free
    databaseName: taxflow
    user: taxflow

services:
  - type: web
    name: taxflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: taxflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Redis/Celery aren't provisioned here — the app only needs a
      # reachable URL at import time, not a working broker, for every
      # endpoint used in this demo except background reminders/OCR
      # dispatch. Point these at a Render Key Value instance if/when you
      # add a Background Worker service for Celery.
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CELERY_BROKER_URL
        value: redis://localhost:6379/1
      - key: CELERY_RESULT_BACKEND
        value: redis://localhost:6379/2
      # Set this to your deployed Cloudflare frontend URL(s), comma-separated,
      # e.g. https://taxflow.pages.dev,https://app.yourdomain.com
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000"
      - key: S3_BUCKET_NAME
        value: taxflow-documents
      - key: S3_REGION
        value: us-east-1
      # S3_ENDPOINT_URL / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY: set these
      # in the Render dashboard (not committed here) once you have a bucket
      # — document upload/download won't work without them.
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: OCR_PROVIDER
        value: tesseract
